[project]
name = "jupyter-ai-lite-demo"
version = "0.1.0"
description = "Jupyter AI Lite Demo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ipywidgets>=8.1.7",
    "jupyterlab>=4.5.0",
    "jupyterlab-day>=0.2.0",
    "jupyterlab-night>=0.5.2",
    "jupyter-ai-lite",
    "jupyter-ai-persona-kit",
    "jupyternaut",
    "jupyterlite-core>=0.8.5",
    "jupyterlite-pyodide-kernel>=0.8.5",
]

[tool.uv.sources]
jupyter-ai-lite = { path = "../python/jupyter-ai-lite" }
jupyter-ai-persona-kit = { path = "../python/jupyter-ai-persona-kit" }
jupyternaut = { path = "../python/jupyternaut" }

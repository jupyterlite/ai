[project]
name = "jupyterlite-ai-demo"
version = "0.1.0"
description = "JupyterLite AI Demo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ipywidgets>=8.1.7",
    "jupyterlab>=4.5.0",
    "jupyterlab-day>=0.2.0",
    "jupyterlab-night>=0.5.2",
    "jupyternaut-persona",
    "jupyternaut-pi",
    "jupyternaut-terminal",
    "jupyterlite-terminal>=1.6.2",
    "jupyterlite-core>=0.8.6",
    "jupyterlite-pyodide-kernel>=0.8.5",
]

[tool.uv.sources]
jupyternaut-persona = { path = "../python/jupyternaut-persona" }
jupyternaut-pi = { path = "../python/jupyternaut-pi" }
jupyternaut-terminal = { path = "../python/jupyternaut-terminal" }

name: Build

on:
  push:
    branches: main
  pull_request:
    branches: '*'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Base Setup
        uses: jupyterlab/maintainer-tools/.github/actions/base-setup@v1

      - name: Install dependencies
        run: python -m pip install -U "jupyterlab>=4.0.0,<5"

      - name: Lint the extension
        run: |
          set -eux
          jlpm
          jlpm run lint:check

      - name: Build the extension
        run: |
          set -eux
          # The terminal extension cannot load in JupyterLab, the isolated test checks its installation
          python scripts/dev_install.py test --no-lite

          jupyter labextension list
          jupyter labextension list 2>&1 | grep -ie "@jupyterlite/ai.*OK"
          jupyter labextension list 2>&1 | grep -ie "@jupyternaut/persona.*OK"
          python -m jupyterlab.browser_check

      - name: Package the extension
        run: |
          set -eux

          pip install build
          python -m build python/jupyternaut-persona --outdir dist
          python -m build python/jupyterlite-ai --outdir dist
          python -m build python/jupyternaut-terminal --outdir dist
          pip uninstall -y "jupyterlite_ai" "jupyternaut_persona" "jupyternaut_terminal" jupyterlab

      - name: Upload extension packages
        uses: actions/upload-artifact@v4
        with:
          name: extension-artifacts
          path: |
            dist/jupyterlite_ai*
            dist/jupyternaut_persona*
            dist/jupyternaut_terminal*
          if-no-files-found: error

  test_isolated:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.14']

    steps:
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: 'x64'
      - uses: actions/download-artifact@v4
        with:
          name: extension-artifacts
      - name: Install and Test
        run: |
          set -eux
          # Remove NodeJS, twice to take care of system and locally installed node versions.
          sudo rm -rf $(which node)
          sudo rm -rf $(which node)

          pip install "jupyterlab>=4.0.0,<5" jupyternaut_persona*.whl jupyterlite_ai*.whl jupyternaut_terminal*.whl

          jupyter labextension list
          jupyter labextension list 2>&1 | grep -ie "@jupyterlite/ai.*OK"
          jupyter labextension list 2>&1 | grep -ie "@jupyternaut/persona.*OK"
          jupyter labextension list 2>&1 | grep -ie "@jupyternaut/terminal.*OK"
          python -m jupyterlab.browser_check --no-browser-test

  check_links:
    name: Check Links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: jupyterlab/maintainer-tools/.github/actions/base-setup@v1
      - uses: jupyterlab/maintainer-tools/.github/actions/check-links@v1
        with:
          ignore_links: '/lite/lab/index.html'

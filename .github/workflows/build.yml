name: Build

on:
  push:
    branches: main
  pull_request:
    branches: '*'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Base Setup
        uses: jupyterlab/maintainer-tools/.github/actions/base-setup@v1

      - name: Install dependencies
        run: python -m pip install -U "jupyterlab>=4.0.0,<5"

      - name: Lint the extension
        run: |
          set -eux
          jlpm
          jlpm run lint:check

      - name: Build the extension
        run: |
          set -eux
          python scripts/dev_install.py test

          jupyter labextension list
          jupyter labextension list 2>&1 | grep -ie "@jupyter-ai/persona-kit.*OK"
          jupyter labextension list 2>&1 | grep -ie "@jupyter-ai/jupyternaut.*OK"
          python -m jupyterlab.browser_check

      - name: Package the extension
        run: |
          set -eux

          pip install build
          python -m build python/jupyter-ai-persona-kit --outdir dist
          python -m build python/jupyternaut --outdir dist
          python -m build python/jupyterlite-ai --outdir dist
          pip uninstall -y "jupyterlite_ai" "jupyternaut" "jupyter_ai_persona_kit" jupyterlab

      - name: Upload extension packages
        uses: actions/upload-artifact@v7
        with:
          name: extension-artifacts
          path: |
            dist/jupyterlite_ai*
            dist/jupyter_ai_persona_kit*
            dist/jupyternaut*
          if-no-files-found: error

  test_isolated:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.14']

    steps:
      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          architecture: 'x64'
      - uses: actions/download-artifact@v8
        with:
          name: extension-artifacts
      - name: Install and Test
        run: |
          set -eux
          # Remove NodeJS, twice to take care of system and locally installed node versions.
          sudo rm -rf $(which node)
          sudo rm -rf $(which node)

          pip install "jupyterlab>=4.0.0,<5" jupyter_ai_persona_kit*.whl jupyternaut*.whl jupyterlite_ai*.whl

          jupyter labextension list
          jupyter labextension list 2>&1 | grep -ie "@jupyter-ai/persona-kit.*OK"
          jupyter labextension list 2>&1 | grep -ie "@jupyter-ai/jupyternaut.*OK"
          python -m jupyterlab.browser_check --no-browser-test

  test_kit_alone:
    name: Install the kit alone
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: extension-artifacts
      - name: Install and check the kit without Jupyternaut
        run: |
          set -eux
          pip install "jupyterlab>=4.0.0,<5" jupyter_ai_persona_kit*.whl
          python -c "import jupyter_ai_persona_kit"

          jupyter labextension list
          jupyter labextension list 2>&1 | grep -ie "@jupyter-ai/persona-kit.*OK"
          if jupyter labextension list 2>&1 | grep -i "jupyternaut"; then exit 1; fi
          python -m jupyterlab.browser_check --no-browser-test

  check_links:
    name: Check Links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: jupyterlab/maintainer-tools/.github/actions/base-setup@v1
      - uses: jupyterlab/maintainer-tools/.github/actions/check-links@v1
        with:
          ignore_links: '/lite/lab/index.html https://deepwiki.com https://jupyterlite-ai.readthedocs.io/en/latest/personas/'
